name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # Node 24 runs TypeScript directly, so the web tests need no framework and no build step.
      - name: Tests
        run: npm run test:web

      - run: npm run build

  science:
    name: Science (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The Python service is a self-contained project under backend/, so it can deploy with
      # its own root and a bundle that cannot reach the frontend, tests, or private files.
      - run: uv sync --extra dev
        working-directory: backend

      - name: Lint
        run: uv run ruff check .
        working-directory: backend

      # Tier-1 analytic checks per .agent/test.md: closed-form values that catch gross
      # algorithmic and unit errors. Differential tests against an independent implementation
      # arrive at M2 and run here too.
      - name: Tests
        run: uv run pytest -q
        working-directory: backend
