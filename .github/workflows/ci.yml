name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  science:
    name: Science (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      # Tier-1 analytic checks per .agent/test.md: closed-form values that catch gross
      # algorithmic and unit errors. Differential tests against an independent implementation
      # arrive at M2 and run here too.
      - name: Tests
        run: uv run pytest -q
