[project]
name = "space-sim-api"
version = "0.1.0"
description = "Python science service: orbital mechanics tools with explicit frames, time scales, and units"
requires-python = ">=3.13"

# Kept in sync with requirements.txt, which is what Vercel's Python runtime reads.
dependencies = [
    "fastapi>=0.115",       # typed routes, pydantic validation, ASGI app Vercel can serve
    "pydantic>=2.9",        # request/response validation per rules.md
    "astropy>=6.1",         # reference frames and time scales - the silent-failure surface
    "skyfield>=1.49",       # satellite positions and pass geometry
    "sgp4>=2.23",           # SGP4 propagation from TLEs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",          # FastAPI test client transport
    "ruff>=0.7",
    "uvicorn>=0.32",        # local run of the ASGI app
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
