[project]
name = "space-sim-api"
version = "0.1.0"
description = "Python science service: orbital mechanics tools with explicit frames, time scales, and units"
requires-python = ">=3.13"

# Kept in sync with requirements.txt, which is what Vercel's Python runtime reads.
dependencies = [
    "fastapi>=0.115",       # typed routes, pydantic validation, ASGI app Vercel can serve
    "pydantic>=2.9",        # request/response validation per rules.md
    "astropy>=6.1",         # reference frames and time scales - the silent-failure surface
    "skyfield>=1.49",       # satellite positions and pass geometry
    "sgp4>=2.23",           # SGP4 propagation from TLEs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",          # FastAPI test client transport
    "ruff>=0.7",
    "uvicorn>=0.32",        # local run of the ASGI app
    # Independent ground truth. Orekit is a mature, flight-proven Java library from a separate
    # codebase and community, so it can grade astropy without the check being circular.
    # DEV ONLY -- deliberately absent from requirements.txt so no JVM ships to Vercel. It
    # generates committed reference files under tests/reference/; CI consumes those.
    "orekit-jpype>=13.1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
